name: fuzz
on:
  schedule:
    - cron: '45 6 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    uses: partsfoundry/crate-workflows/.github/workflows/fuzz.yml@1e0c8988d43817a1ca1d8ced76ee048edb0a8aed
    with:
      # Crash inputs are public. Set true only for a crate with no unsafe code.
      public-crash-inputs: false
